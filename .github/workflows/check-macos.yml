name: Check macOS

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      # Linux- and Windows-only modules are compiled out on macOS. The source
      # scans that read them run in Check Linux, which takes every src change.
      - "!src/linux*.rs"
      - "!src/windows*.rs"
      - "!src/**/linux.rs"
      - "!src/**/windows.rs"
      - "native/**"
      - "macos/HexMicrophoneDriver/Info.plist"
      - "resources/**"
      - "!resources/windows/**"
      - "assets/**"
      - "app/AppIcon.icon/**"
      - "sdk/commands/**"
      - ".github/workflows/check-macos.yml"
      - "scripts/personal-signing.sh"
      - "scripts/build-personal-app.sh"
      - "scripts/test-personal-signing.sh"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      # Linux- and Windows-only modules are compiled out on macOS. The source
      # scans that read them run in Check Linux, which takes every src change.
      - "!src/linux*.rs"
      - "!src/windows*.rs"
      - "!src/**/linux.rs"
      - "!src/**/windows.rs"
      - "native/**"
      - "macos/HexMicrophoneDriver/Info.plist"
      - "resources/**"
      - "!resources/windows/**"
      - "assets/**"
      - "app/AppIcon.icon/**"
      - "sdk/commands/**"
      - ".github/workflows/check-macos.yml"
      - "scripts/personal-signing.sh"
      - "scripts/build-personal-app.sh"
      - "scripts/test-personal-signing.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Formatting is checked once, in Check Linux.
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the Metal toolchain
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: ./scripts/test-personal-signing.sh
      - run: cargo clippy --locked --bin voice-control --tests -- -D warnings
      - run: cargo test --locked --bin voice-control
